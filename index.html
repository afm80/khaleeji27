function parsePairs(text) {
  var lines = text.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; });
  var out = [];
  for (var i = 0; i + 1 < lines.length; i += 2) {
    out.push({ name: lines[i], url: lines[i + 1] });
  }
  return out;
}

function showIframe(src) {

}

function getYouTubeId(url) {
  if (!url) return null;
  try {
    var parsed = new URL(url);
    var host = parsed.hostname.toLowerCase();
    var id = null;

    if (host === 'youtu.be') {
      id = parsed.pathname.split('/').filter(Boolean)[0];
    } else if (host === 'youtube.com' || host.endsWith('.youtube.com')) {
      id = parsed.searchParams.get('v');
      if (!id) {
        var pathMatch = parsed.pathname.match(/^\/(?:embed|live|shorts)\/([^/]+)/);
        id = pathMatch ? pathMatch[1] : null;
      }
    }

    return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
  } catch(e) {
    return null;
  }
}

function toYouTubeEmbed(url) { var id = getYouTubeId(url); return id ? 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&enablejsapi=1' : null; }
function toVimeoEmbed(url) { var m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/); return m ? 'https://player.vimeo.com/video/' + m[1] + '?autoplay=1' : null; }
function toFacebookEmbed(url) { return 'https://www.facebook.com/plugins/video.php?href=' + encodeURIComponent(url) + '&autoplay=1'; }
function toDailymotionEmbed(url) { var m = url.match(/dailymotion\.com\/video\/([A-Za-z0-9]+)/); return m ? 'https://www.dailymotion.com/embed/video/' + m[1] + '?autoplay=1' : null; }
function toTwitchEmbed(url) { var m = url.match(/twitch\.tv\/([A-Za-z0-9_]+)/); return m ? 'https://player.twitch.tv/?channel=' + m[1] + '&parent=' + location.hostname + '&autoplay=true' : null; }
function toStreamableEmbed(url) { var m = url.match(/streamable\.com\/([A-Za-z0-9]+)/); return m ? 'https://streamable.com/e/' + m[1] + '?autoplay=1' : null; }
function toTwitterEmbed(url) { return /twitter\.com|x\.com/.test(url) ? 'https://twitframe.com/show?url=' + encodeURIComponent(url) : null; }
function toOkEmbed(url) { var m = url.match(/ok\.ru\/video\/(\d+)/); return m ? 'https://ok.ru/videoembed/' + m[1] + '?autoplay=1' : null; }
function toVkEmbed(url) { var m = url.match(/vk\.com\/video(-?\d+)_(\d+)/); return m ? 'https://vk.com/video_ext.php?oid=' + m[1] + '&id=' + m[2] + '&autoplay=1' : null; }
function toRumbleEmbed(url) { var m = url.match(/rumble\.com\/(?:embed\/)?([A-Za-z0-9]+)/); return m ? 'https://rumble.com/embed/' + m[1] + '/' : null; }
function toBitchuteEmbed(url) { var m = url.match(/bitchute\.com\/video\/([A-Za-z0-9]+)/); return m ? 'https://www.bitchute.com/embed/' + m[1] + '/' : null; }
function toOdyseeEmbed(url) { var m = url.match(/odysee\.com\/.*[:/]([A-Za-z0-9]+)/); return m ? 'https://odysee.com/$/embed/' + m[1] : null; }
function toArchiveEmbed(url) { var m = url.match(/archive\.org\/details\/([^\/\?]+)/); return m ? 'https://archive.org/embed/' + m[1] : null; }
function toMp4UploadEmbed(url) { var m = url.match(/mp4upload\.com\/(?:embed-)?([A-Za-z0-9]+)/); return m ? 'https://www.mp4upload.com/embed-' + m[1] + '.html' : null; }
function toDoodEmbed(url) { var m = url.match(/dood(?:stream|\.)?\.?(?:com|to|so|pm|watch|sh|re|la|ws|gs|life|yt|li|si|cf|wtf|best|cx|nu|vip)\/(?:e|d)\/([A-Za-z0-9]+)/i); return m ? 'https://dood.to/e/' + m[1] : null; }
function isDash(url) { return /\.mpd(\?.*)?$/i.test(url) || /format=mpd/i.test(url); }
function isMkv(url) { return /\.mkv(\?.*)?$/i.test(url); }
function isTs(url) { return /\.ts(\?.*)?$/i.test(url); }
function isDirectVideo(url) { return /\.(mp4|webm|ogg|ogv|mov|m4v|3gp|m4s|mp3|aac|m4a)(\?.*)?$/i.test(url); }
function isRtmp(url) { return /^rtmp:\/\//i.test(url); }
function isRtsp(url) { return /^rtsp:\/\//i.test(url); }

function stopAllPlayers() {
  engineToken++;

  try { if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; } } catch(e){}
  try { if (shakaPlayer) { shakaPlayer.destroy(); shakaPlayer = null; } } catch(e){}

  document.querySelectorAll('audio, video').forEach(function(media) {
    try {
      media.pause();
      media.muted = true;
      media.volume = 0;
      media.removeAttribute('src');
      media.load();
    } catch(e){}
  });

  wrapEl.querySelectorAll('iframe').forEach(function(frame) { frame.remove(); });
  wrapEl.querySelectorAll('[data-player-host]').forEach(function(host) { host.remove(); });
  hideMsg();
}

function ensureFreshVideo() {
  try {
    var oldVideo = document.getElementById('videoEl');
    if (oldVideo && oldVideo.parentNode) {
      try { oldVideo.pause(); } catch(e){}
      try { oldVideo.removeAttribute('src'); } catch(e){}
      try { oldVideo.load(); } catch(e){}
      oldVideo.parentNode.removeChild(oldVideo);
    }

    videoEl = document.createElement('video');
    videoEl.id = 'videoEl';
    videoEl.controls = true;
    videoEl.autoplay = true;
    videoEl.playsInline = true;
    videoEl.setAttribute('playsinline', '');
    videoEl.setAttribute('webkit-playsinline', '');
    videoEl.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:#000;z-index:1;';

    if (wrapEl.firstChild) {
      wrapEl.insertBefore(videoEl, wrapEl.firstChild);
    } else {
      wrapEl.appendChild(videoEl);
    }
  } catch(e) {
    console.error('ensureFreshVideo error:', e);
  }
}

function playPrimary(url) {
  stopAllPlayers();
  currentUrl = url;
  showMsg('⏳ جاري تشغيل المشغل الرئيسي...');
  setTimeout(hideMsg, 1500);

  ensureFreshVideo();

  var yt = toYouTubeEmbed(url);        if (yt) { showIframe(yt); return; }
  var vm = toVimeoEmbed(url);          if (vm) { showIframe(vm); return; }
  if (/facebook\.com|fb\.watch/.test(url)) { showIframe(toFacebookEmbed(url)); return; }
  var dm = toDailymotionEmbed(url);    if (dm) { showIframe(dm); return; }
  var tw = toTwitchEmbed(url);         if (tw) { showIframe(tw); return; }
  var st = toStreamableEmbed(url);     if (st) { showIframe(st); return; }
  var tx = toTwitterEmbed(url);        if (tx) { showIframe(tx); return; }
  var ok = toOkEmbed(url);             if (ok) { showIframe(ok); return; }
  var vk = toVkEmbed(url);             if (vk) { showIframe(vk); return; }
  var rb = toRumbleEmbed(url);         if (rb) { showIframe(rb); return; }
  var bc = toBitchuteEmbed(url);       if (bc) { showIframe(bc); return; }
  var od = toOdyseeEmbed(url);         if (od) { showIframe(od); return; }
  var ar = toArchiveEmbed(url);        if (ar) { showIframe(ar); return; }
  var mu = toMp4UploadEmbed(url);      if (mu) { showIframe(mu); return; }
  var dd = toDoodEmbed(url);           if (dd) { showIframe(dd); return; }

  if (isRtmp(url) || isRtsp(url)) { showMsg('⚠ رابط RTMP/RTSP لا يعمل في المتصفح.'); return; }

  if (isDash(url)) {
    if (window.shaka && shaka.Player.isBrowserSupported()) {
      shakaPlayer = new shaka.Player(videoEl);
      shakaPlayer.load(url).then(function() { videoEl.play(); }).catch(function() {
        try { shakaPlayer.destroy(); } catch(e) {}
        shakaPlayer = null;
        showMsg('⚠ فشل تشغيل رابط DASH');
      });
    } else { showMsg('⚠ المتصفح لا يدعم DASH'); }
    return;
  }

  if (isMkv(url) || isTs(url)) {
    videoEl.src = url;
    videoEl.play().catch(function() { showMsg('⚠ الصيغة غير مدعومة'); });
    return;
  }

  if (isDirectVideo(url)) {
    videoEl.src = url;
    videoEl.play().catch(function() { showMsg('⚠ تعذّر التشغيل'); });
    return;
  }

  var token = ++engineToken;
  var engines = ['hlsjs', 'native'];
  var index = 0;

  function tryNext() {
    if (token !== engineToken) return;
    if (index >= engines.length) {
      if (fallbackCycle === 0) {
        fallbackCycle = 1;
        showMsg('⚠ تعذر التشغيل، جاري الانتقال للمشغل الاحتياطي...');
        setTimeout(function() {
          if (token === engineToken) switchPlayer('backup1', true);
        }, 500);
      } else {
        showMsg('⚠ تعذر تشغيل الرابط بالمشغلين المتاحين.');
      }
      return;
    }
    var engine = engines[index++];

    if (engine === 'hlsjs' && window.Hls && Hls.isSupported()) {
      try {
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(videoEl);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function(){ videoEl.play().catch(function(){}); });
        hlsInstance.on(Hls.Events.ERROR, function(e, data){
          if (data && data.fatal && token === engineToken) {
            try { hlsInstance.destroy(); } catch(error) {}
            hlsInstance = null;
            tryNext();
          }
        });
      } catch(e) { tryNext(); }
      return;
    }
    if (engine === 'native') {
      try {
        videoEl.src = url;
        videoEl.onerror = function(){ if (token === engineToken) tryNext(); };
        videoEl.play().catch(function(){ if (token === engineToken) tryNext(); });
      } catch(e) { tryNext(); }
      return;
    }
    tryNext();
  }
  tryNext();
}

function playBackup1(url) {
  stopAllPlayers();
  currentUrl = url;
  showMsg('⏳ جاري تشغيل المشغل الاحتياطي...');

  var yt = toYouTubeEmbed(url);
  var vm = toVimeoEmbed(url);
  if (yt || vm || /facebook\.com|fb\.watch/.test(url)) {
    returnToPrimary('⚠ المشغل الاحتياطي لا يدعم هذا النوع من الروابط.');
    return;
  }

  if (!window.shaka || !shaka.Player.isBrowserSupported()) {
    returnToPrimary('⚠ المتصفح لا يدعم المشغل الاحتياطي.');
    return;
  }

  try {
    if (!document.getElementById('videoEl')) {
      ensureFreshVideo();
    } else {
      videoEl = document.getElementById('videoEl');
    }

    videoEl.style.display = 'block';
    videoEl.controls = true;

    try { videoEl.muted = false; videoEl.volume = 1; } catch(e){}

    shakaPlayer = new shaka.Player(videoEl);
    try { shakaPlayer.configure({ abr: { enabled: true } }); } catch(e){}

    shakaPlayer.load(url).then(function() {
      hideMsg();
      try { videoEl.muted = false; videoEl.volume = 1; } catch(e){}
      videoEl.play().then(function() {
        try { videoEl.muted = false; videoEl.volume = 1; } catch(e){}
      }).catch(function() {
        try { videoEl.muted = false; } catch(e){}
      });
    }).catch(function(err) {
      console.error('Shaka error:', err);
      returnToPrimary('⚠ فشل تشغيل الرابط بالمشغل الاحتياطي.');
    });
  } catch(e) {
    console.error('Shaka catch:', e);
    returnToPrimary('⚠ حدث خطأ في المشغل الاحتياطي.');
  }
}

function returnToPrimary(message) {
  var token = engineToken;
  fallbackCycle = Math.min(fallbackCycle + 1, 2);
  showMsg(message + ' جاري الرجوع للمشغل الرئيسي...');
  setTimeout(function() {
    if (token === engineToken && currentPlayer === 'backup1') {
      switchPlayer('primary', true);
    }
  }, 1200);
}

function switchPlayer(player, automatic) {
  if (!automatic) fallbackCycle = 0;
  currentPlayer = player;

  document.querySelectorAll('.primary-btn, .backup-btn').forEach(function(btn) {
    btn.classList.remove('active');
  });

  if (player === 'primary') {
    document.getElementById('primaryBtn').classList.add('active');
  } else if (player === 'backup1') {
    document.getElementById('backupBtn1').classList.add('active');
  }

  if (currentUrl) {
    if (player === 'primary') {
      playPrimary(currentUrl);
    } else if (player === 'backup1') {
      playBackup1(currentUrl);
    }
  }
}

var channelsOverlay = document.getElementById('channelsOverlay');
var channelsMenuBtn = document.getElementById('channelsMenuBtn');
var channelsDropdown = document.getElementById('channelsDropdown');
var hideTimer = null;

function buildChannelButtons() {
  channelsOverlay.innerHTML = '';
  CHANNELS.forEach(function(ch, index) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'channel-btn';
    btn.textContent = ch.name || String(index + 1);
    btn.dataset.index = index;
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      switchChannel(index);
      showOverlayTemporarily();
    });
    channelsOverlay.appendChild(btn);
  });
}

function buildChannelsDropdown() {
  channelsDropdown.innerHTML = '';
  CHANNELS.forEach(function(ch, index) {
    var item = document.createElement('button');
    item.type = 'button';
    item.className = 'channels-dropdown-item';
    item.textContent = ch.name || ('قناة ' + (index + 1));
    item.dataset.index = index;
    item.addEventListener('click', function(e) {
      e.stopPropagation();
      switchChannel(index);
      channelsDropdown.classList.remove('show');
    });
    channelsDropdown.appendChild(item);
  });
}

function updateDropdownActive(index) {
  channelsDropdown.querySelectorAll('.channels-dropdown-item').forEach(function(item, i) {
    item.classList.toggle('active', i === index);
  });
}

function switchChannel(index) {
  var ch = CHANNELS[index];
  if (!ch || !ch.url) return;
  currentChannelIndex = index;
  fallbackCycle = 0;

  document.querySelectorAll('.channel-btn').forEach(function(b, i) {
    b.classList.toggle('active', i === index);
  });
  updateDropdownActive(index);

  if (currentPlayer === 'primary') {
    playPrimary(ch.url);
  } else if (currentPlayer === 'backup1') {
    playBackup1(ch.url);
  }
}

function showOverlayTemporarily() {
  channelsOverlay.classList.remove('hidden');
  if (hideTimer) clearTimeout(hideTimer);
  hideTimer = setTimeout(function() {
    channelsOverlay.classList.add('hidden');
  }, 3000);
}

function attachOverlayAutoHide() {
  wrapEl.addEventListener('mousemove', showOverlayTemporarily);
  wrapEl.addEventListener('touchstart', showOverlayTemporarily);
  wrapEl.addEventListener('mouseleave', function() {
    channelsOverlay.classList.add('hidden');
  });
  showOverlayTemporarily();
}

channelsMenuBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  var shouldOpen = !channelsDropdown.classList.contains('show');
  channelsDropdown.classList.toggle('show', shouldOpen);

  if (shouldOpen) {
    var buttonRect = channelsMenuBtn.getBoundingClientRect();
    var dropdownHeight = Math.min(channelsDropdown.scrollHeight, 300);
    var spaceBelow = window.innerHeight - buttonRect.bottom;
    var spaceAbove = buttonRect.top;
    channelsDropdown.classList.toggle('drop-up', spaceBelow < dropdownHeight + 12 && spaceAbove > spaceBelow);
  } else {
    channelsDropdown.classList.remove('drop-up');
  }
});

document.addEventListener('click', function(event) {
  if (!event.target.closest('.channels-menu-wrapper')) {
    channelsDropdown.classList.remove('show');
    channelsDropdown.classList.remove('drop-up');
  }
});

window.addEventListener('resize', function() {
  channelsDropdown.classList.remove('show');
  channelsDropdown.classList.remove('drop-up');
});

function initChannelsMenu() {
  if (CHANNELS.length > 1) {
    channelsMenuBtn.classList.add('show');
  } else {
    channelsMenuBtn.classList.remove('show');
  }
}

/* ============================================================
   📢 بناء الشريط المتحرك — كل رسالة span منفصل + مسافة واضحة
   ============================================================ */
function buildMarquee() {
  var track = document.querySelector('.marquee-track');
  if (!track) return;

  var messages = MARQUEE_TEXT
    .split('\n')
    .map(function(l) { return l.trim(); })
    .filter(function(l) { return l.length > 0; });

  YOUTUBE_VIDEOS.forEach(function(item) {
    if (item.name) messages.push('بث مباشر: ' + item.name);
  });

  if (messages.length === 0) return;

  track.innerHTML = '';

  function addSet() {
    messages.forEach(function(msg) {
      var span = document.createElement('span');
      span.className = 'marquee-item';
      span.textContent = '. ' + msg;
      track.appendChild(span);
    });
  }

  /* نسختين للتدوير السلس */
  addSet();
  addSet();
}

var youtubePage = 1;
var youtubePageSize = 10;

function buildYouTubeCards() {
  var grid = document.getElementById('youtubeGrid');
  if (!grid) return;
  grid.innerHTML = '';

  var totalPages = Math.max(1, Math.ceil(YOUTUBE_VIDEOS.length / youtubePageSize));
  youtubePage = Math.min(youtubePage, totalPages);
  var start = (youtubePage - 1) * youtubePageSize;
  var pageItems = YOUTUBE_VIDEOS.slice(start, start + youtubePageSize);

  pageItems.forEach(function(item) {
    var id = getYouTubeId(item.url);
    if (!id) return;

    var card = document.createElement('a');
    card.className = 'yt-card';
    card.href = '#';

    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    var img = document.createElement('img');
    img.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
    img.alt = item.name || 'YouTube';
    img.loading = 'lazy';
    img.onerror = function() { this.src = 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg'; };
    thumb.appendChild(img);

    var info = document.createElement('div');
    info.className = 'info';
    var title = document.createElement('p');
    title.className = 'title';
    title.textContent = item.name || 'بث مباشر';
    info.appendChild(title);

    card.appendChild(thumb);
    card.appendChild(info);

    card.addEventListener('click', function(e) {
      e.preventDefault();
      openYouTubeOverlay(item.url, item.name);
    });

    grid.appendChild(card);
  });

  buildYouTubePagination(totalPages);
}

function buildYouTubePagination(totalPages) {
  var pagination = document.getElementById('youtubePagination');
  if (!pagination) return;
  pagination.innerHTML = '';
  pagination.hidden = totalPages <= 1;
  if (totalPages <= 1) return;

  for (var page = 1; page <= totalPages; page += 1) {
    var button = document.createElement('button');
    button.type = 'button';
    button.textContent = String(page);
    button.setAttribute('aria-label', 'الصفحة ' + page);
    button.classList.toggle('active', page === youtubePage);
    button.addEventListener('click', function() {
      youtubePage = Number(this.textContent);
      buildYouTubeCards();
      document.querySelector('.youtube-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    pagination.appendChild(button);
  }
}

var youtubeOverlay = document.getElementById('youtubeOverlay');
var overlayVideo = document.getElementById('overlayVideo');
var overlayTitle = document.getElementById('overlayTitle');
var backBtn = document.getElementById('backBtn');
var overlayOpen = false;
var overlayResumeUrl = '';
var overlayResumePlayer = 'primary';

function openYouTubeOverlay(url, name, restoring) {
  var id = getYouTubeId(url);
  if (!id) return;

  overlayResumeUrl = currentUrl;
  overlayResumePlayer = currentPlayer;
  stopAllPlayers();
  overlayVideo.innerHTML = '';
  overlayTitle.textContent = '🔴 ' + (name || 'قناة البث');

  var iframe = document.createElement('iframe');
  iframe.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&enablejsapi=1';
  iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  iframe.allowFullscreen = true;
  overlayVideo.appendChild(iframe);

  youtubeOverlay.classList.add('show');
  overlayOpen = true;

  if (!restoring) {
    try { history.pushState({ view: 'youtube' }, '', '#yt=' + id); } catch(e){}
  }
  document.body.style.overflow = 'hidden';
}

function restoreYouTubeOverlay() {
  var match = location.hash.match(/^#yt=([A-Za-z0-9_-]{11})$/);
  if (!match) return false;

  var video = YOUTUBE_VIDEOS.find(function(item) {
    return getYouTubeId(item.url) === match[1];
  });
  if (!video) return false;

  openYouTubeOverlay(video.url, video.name, true);
  return true;
}

function closeYouTubeOverlay(fromPopstate) {
  if (!overlayOpen) return;
  overlayVideo.innerHTML = '';
  youtubeOverlay.classList.remove('show');
  overlayOpen = false;
  document.body.style.overflow = '';

  var resumeUrl = overlayResumeUrl;
  var resumePlayer = overlayResumePlayer;
  overlayResumeUrl = '';
  if (resumeUrl) {
    currentUrl = resumeUrl;
    currentPlayer = resumePlayer;
    if (resumePlayer === 'backup1') {
      playBackup1(resumeUrl);
    } else {
      playPrimary(resumeUrl);
    }
  }

  if (!fromPopstate) {
    if (history.state && history.state.view === 'youtube') {
      try { history.back(); } catch(e){}
      return;
    }
  }
}

backBtn.addEventListener('click', function() { closeYouTubeOverlay(false); });
window.addEventListener('popstate', function() {
  if (overlayOpen) closeYouTubeOverlay(true);
});

document.getElementById('primaryBtn').addEventListener('click', function() {
  if (currentPlayer === 'primary') return;
  switchPlayer('primary');
});

document.getElementById('backupBtn1').addEventListener('click', function() {
  if (currentPlayer === 'backup1') return;
  switchPlayer('backup1');
});

window.addEventListener('pagehide', function() { stopAllPlayers(); });
window.addEventListener('beforeunload', function() { stopAllPlayers(); });

var audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;

  document.querySelectorAll('video, audio').forEach(function(media) {
    try {
      if (media.muted || media.volume === 0) {
        media.muted = false;
        media.volume = 1;
      }
      if (media.paused && media.readyState > 2) {
        media.play().catch(function(){});
      }
    } catch(e){}
  });

  try {
    if (shakaPlayer && videoEl) {
      videoEl.muted = false;
      videoEl.volume = 1;
      if (videoEl.paused) {
        videoEl.play().catch(function(){});
      }
    }
  } catch(e){}

  try {
    document.querySelectorAll('iframe').forEach(function(iframe) {
      if (iframe.contentWindow && iframe.src.indexOf('youtube.com') > -1) {
        iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
        iframe.contentWindow.postMessage('{"event":"command","func":"setVolume","args":[100]}', '*');
      }
    });
  } catch(e){}
}

document.addEventListener('pointerdown', unlockAudio, { once: true, passive: true });
document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
document.addEventListener('keydown', unlockAudio, { once: true, passive: true });

var deferredPrompt = null;
var installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.classList.add('show');
});

installBtn.addEventListener('click', function() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(choice) {
    if (choice.outcome === 'accepted') {
      installBtn.classList.remove('show');
    }
    deferredPrompt = null;
  });
});

window.addEventListener('appinstalled', function() {
  installBtn.classList.remove('show');
  deferredPrompt = null;
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
      console.log('SW registration failed:', err);
    });
  });
}

buildChannelButtons();
buildChannelsDropdown();
buildMarquee();
initChannelsMenu();
attachOverlayAutoHide();
buildYouTubeCards();

try { history.scrollRestoration = 'manual'; } catch(e){}
if (CHANNELS.length > 0 && CHANNELS[0].url) {
  switchChannel(0);
}

var restoredYouTube = restoreYouTubeOverlay();
if (!restoredYouTube) window.scrollTo(0, 0);
</script>
